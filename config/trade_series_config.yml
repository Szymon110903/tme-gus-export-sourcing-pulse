#
# Identyfikatory okresów (id-okres) NIE są wpisywane na sztywno – są rozwiązywane
# dynamicznie ze słownika /dictionaries/periods-dictionary (tabela ref.dim_period)
# i weryfikowane przez /variable/variable-section-periods.
# Katalog zweryfikowanych ID generuje skrypt: python -m src.pipelines.discover_metadata

date_range:
  start_year: 2019
  end_year: 2026
  # Liczba ostatnich miesięcy odświeżanych ponownie w celu wychwycenia rewizji Intrastat
  recheck_recent_months: 3
  # Reguły rozwiązywania okresów w ref.dim_period
  period_modes:
    monthly:
      nazwa_typ: "dane miesięczne"
    cumulative:
      nazwa_typ: "dane narastające"
      include_january_monthly: true

