services:
  etl:
    build: .
    container_name: tme-gus-etl
    env_file:
      - .env
    volumes:
      - .:/app
    working_dir: /app
    stdin_open: true
    tty: true

  airflow:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: tme-gus-airflow
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: "SequentialExecutor"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "sqlite:////opt/airflow/airflow_db/airflow.db"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./sql:/opt/airflow/sql
      - ./docs:/opt/airflow/docs
      - ./reports:/opt/airflow/reports
      - ./data_quality:/opt/airflow/data_quality
      - airflow_db:/opt/airflow/airflow_db
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        exec airflow standalone

volumes:
  airflow_db:
